name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test -- --no-watch

  verify:
    name: Lint and build
    # Also on pull requests, so a lint or build error shows up before the merge
    # instead of on main after it. Making it block the merge needs this job as a
    # required status check in the branch protection settings.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    name: Build and push image
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name and tag
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # main publishes latest, the tag the deployed compose pulls. dev publishes
          # dev, the tag a test container uses through WEB_IMAGE. Those are the only
          # branches under on.push, so the else is dev.
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # One job, one place deciding the tag, so CI and the deployed compose
          # cannot disagree about which image is which.
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          # La URL de la API se hornea en el bundle: va como build-arg, no como
          # variable de entorno del contenedor. Definirla en Settings > Secrets and
          # variables > Actions > Variables (no como secret: termina en el JS publico).
          build-args: |
            API_URL=${{ vars.API_URL }}
